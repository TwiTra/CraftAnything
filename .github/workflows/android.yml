name: Android bauen

# Baut jede App unter apps/<name>, führt Unit-Tests und Lint aus und legt die Debug-APK als Artifact ab.
# Bei einem Tag wie v1.0.0 werden die APKs zusätzlich an ein GitHub-Release gehängt.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # nur für das Release bei Tags

jobs:
  apps-finden:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.find.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          apps=$(find apps -mindepth 2 -maxdepth 2 -name gradlew -printf '%h\n' 2>/dev/null | xargs -r -n1 basename | sort | jq -R . | jq -sc .)
          echo "apps=${apps:-[]}" >> "$GITHUB_OUTPUT"

  bauen:
    needs: apps-finden
    if: needs.apps-finden.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.apps-finden.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK einrichten
        run: scripts/android-setup.sh
      - name: Tests, Lint, Debug-APK
        working-directory: apps/${{ matrix.app }}
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
        env:
          ANDROID_HOME: /opt/android-sdk
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-debug-apk
          path: apps/${{ matrix.app }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Release-Anhang
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/${{ matrix.app }}/app/build/outputs/apk/debug/*.apk
